<style>
/* ============================================
   CampAI— Dark Dashboard Stylesheet
   Compatible: Google Apps Script HTML Service
   ============================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* --- DESIGN TOKENS --- */
:root {
  --bg-page:    #121410;
  --bg-card:    #1A1D16;

  --c-900: #E8EDD8;
  --c-700: #D0D6B3;
  --c-500: #AAAE7F;
  --c-300: #5F7044;
  --c-200: #2B381E;
  --c-100: #1F2A14;

  --text-primary:   #E8EDD8;
  --text-secondary: #A3AB8E;
  --text-muted:     #788066;

  --status-ok:      #8BE346;
  --status-ok-bg:   rgba(139, 227, 70, 0.15);
  --status-warn:    #F7C844;
  --status-warn-bg: rgba(247, 200, 68, 0.15);
  --status-err:     #F76F44;
  --status-err-bg:  rgba(247, 111, 68, 0.15);

  --radius-sm:  10px;
  --radius-md:  16px;
  --radius-lg:  20px;
  --radius-xl:  28px;
  --radius-pill: 999px;

  --shadow-card: 0 4px 20px rgba(0,0,0,0.3);

  --font-display: 'DM Serif Display', serif;
  --font-body:    'DM Sans', sans-serif;

  --transition: 0.2s ease;
}

/* --- BASE --- */
body {
  font-family: var(--font-body);
  background: var(--bg-page);
  color: var(--text-primary);
  min-height: 100vh;
}

/* --- LAYOUT --- */
.app  { display: block; }
.main { padding: 32px 5%; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

/* --- HEADER --- */
.header { display: flex; justify-content: space-between; align-items: flex-end; }
.header__greeting { font-size: 14px; color: var(--text-muted); font-style: italic; margin-bottom: 4px; }
.header__title    { font-family: var(--font-display); font-size: 34px; color: var(--c-900); }

/* Editable username */
.editable-name {
  border-bottom: 2px dashed rgba(232,237,216,0.3);
  outline: none;
  display: inline-block;
  min-width: 60px;
  padding: 0 4px;
  border-radius: 4px;
  transition: border-color var(--transition), background var(--transition);
}
.editable-name:hover,
.editable-name:focus { border-bottom-color: var(--status-ok); background: rgba(255,255,255,0.05); }

.header__right { display: flex; gap: 14px; }
.header__badge,
.header__time {
  background: var(--bg-card);
  border: 1px solid var(--c-200);
  border-radius: var(--radius-pill);
  padding: 7px 16px;
  font-size: 13px;
  color: var(--text-secondary);
  box-shadow: var(--shadow-card);
  display: flex;
  align-items: center;
  gap: 8px;
}
.header__badge-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--status-ok);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* --- DASHBOARD GRID --- */
.dashboard-wrapper {
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 24px;
}
/* Grid placement */
.dashboard-wrapper > .cards-grid  { grid-column: 1 / 2; grid-row: 1 / 2; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dashboard-wrapper > .chart-panel { grid-column: 2 / 3; grid-row: 1 / 2; }
.dashboard-wrapper > .chat-panel  { grid-column: 1 / 2; grid-row: 2 / 3; }
.dashboard-wrapper > .trivia-card { grid-column: 2 / 3; grid-row: 2 / 3; }

/* --- Tablet Landscape & iPad (max-width: 1024px) --- */
@media (max-width: 1024px) {
  .main { padding: 24px; }
  
  /* Ubah Grid menjadi Stack (Tumpukan vertikal) agar lega */
  .dashboard-wrapper {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  
  /* Keempat kartu sensor sejajar di tablet */
  .dashboard-wrapper > .cards-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
}

/* --- Mobile / HP (max-width: 768px) --- */
@media (max-width: 768px) {
  .main { padding: 16px; }
  
  .header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .header__right { width: 100%; justify-content: space-between; }
  
  /* Kartu sensor menjadi kotak 2x2 yang proporsional */
  .dashboard-wrapper > .cards-grid {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* Penyesuaian ukuran font & padding agar tidak terlalu sesak di HP */
  .sensor-card { padding: 16px; border-radius: 16px; }
  .sensor-card__number { font-size: 28px; }
  .sensor-card__label { font-size: 10px; }
  
  .chart-panel { padding: 16px; border-radius: 16px; }
  .chart-panel__title { font-size: 18px; }
  .chart-panel__header { flex-direction: column; align-items: flex-start; }
  .chart-tab { padding: 6px 12px; font-size: 11px; }
  
  .trivia-card { min-height: 180px; }
  .trivia-card__content { padding: 20px; }
  
  .chat-panel { min-height: 400px; border-radius: 16px; }
  .chat-messages { max-height: 300px; }
}

/* --- Layar HP Sangat Kecil (max-width: 480px) --- */
@media (max-width: 480px) {
  .dashboard-wrapper > .cards-grid {
    gap: 10px;
  }
  .sensor-card { padding: 14px; }
  .sensor-card__number { font-size: 24px; }
  .sensor-card__unit { font-size: 12px; }
  
  /* Header badges memanjang penuh agar mudah ditekan */
  .header__right { flex-direction: column; width: 100%; gap: 10px; }
  .header__badge, .header__time { width: 100%; justify-content: center; }
}

/* --- SENSOR CARDS --- */
.sensor-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 20px;
  border: 1px solid var(--c-200);
  position: relative;
  overflow: hidden;
  transition: transform var(--transition), box-shadow var(--transition);
}
.sensor-card:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.4); }

/* Accent top bar */
.sensor-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.sensor-card--wb::before  { background: var(--c-700); }
.sensor-card--dk::before  { background: var(--c-500); }
.sensor-card--lux::before { background: var(--c-300); }
.sensor-card--rh::before  { background: var(--status-ok); }

.sensor-card__header  { display: flex; justify-content: space-between; margin-bottom: 16px; }
.sensor-card__label   { font-size: 12px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.sensor-card__number  { font-family: var(--font-display); font-size: 36px; color: var(--c-900); transition: color 0.4s; }
.sensor-card__unit    { font-size: 14px; color: var(--text-muted); margin-left: 4px; }
.sensor-card__footer  { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.sensor-card__trend   { font-size: 12px; color: var(--text-muted); }

.sensor-card__status          { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: var(--radius-pill); }
.sensor-card__status--ok      { background: var(--status-ok-bg);  color: var(--status-ok);   }
.sensor-card__status--warn    { background: var(--status-warn-bg); color: var(--status-warn); }
.sensor-card__status--err     { background: var(--status-err-bg);  color: var(--status-err);  }

/* Number update flash animation */
@keyframes flashUpdate { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.sensor-card__number--updating { animation: flashUpdate 0.6s ease; }

/* --- CHART PANEL --- */
.chart-panel {
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: 24px;
  border: 1px solid var(--c-200);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.chart-panel__title    { font-family: var(--font-display); font-size: 22px; }
.chart-panel__subtitle { font-size: 12px; color: var(--text-muted); }
.chart-panel__header   { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.chart-panel__tabs     { display: flex; gap: 8px; flex-wrap: wrap; }

.chart-tab {
  background: transparent;
  border: 1px solid var(--c-200);
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: all var(--transition);
  font-family: var(--font-body);
  font-size: 13px;
}
.chart-tab--active,
.chart-tab:hover { background: var(--c-900); color: var(--bg-page); border-color: var(--c-900); }

/* Chart area & graphs */
.chart-area { position: relative; height: 180px; }

/* Loading placeholder */
.chart-placeholder {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  color: var(--text-muted); font-size: 13px;
}
.chart-placeholder.hidden { display: none; }
.chart-spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--c-200);
  border-top-color: var(--status-ok);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.chart-graph { display: none; height: 100%; opacity: 0; }
.chart-graph--active { display: block; opacity: 1; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Plot wajib relative agar Chart.js bisa mengatur ukurannya (responsive) */
.chart-graph__plot { width: 100%; height: 100%; position: relative; }

/* Chart navigation */
.chart-panel__nav { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: auto; padding-top: 8px; }
.chart-nav-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--c-200);
  background: transparent; color: var(--text-secondary); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.chart-nav-btn:hover { border-color: var(--status-ok); color: var(--status-ok); background: rgba(139,227,70,0.05); }

.chart-dots { display: flex; gap: 8px; align-items: center; }
.chart-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--c-200); cursor: pointer;
  transition: all 0.3s ease;
}
.chart-dot--active { width: 28px; border-radius: 4px; background: var(--status-ok); }

/* --- TRIVIA / SMART CARD --- */
.trivia-card {
  border-radius: var(--radius-xl);
  position: relative; overflow: hidden;
  display: flex;
  box-shadow: var(--shadow-card);
  background-image: url('https://images.unsplash.com/photo-1530836369250-ef71a3a5e4b6?q=80&w=800&auto=format&fit=crop');
  background-size: cover; background-position: center;
  border: 1px solid var(--c-200);
  min-height: 250px;
}
.trivia-card__overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(18,20,16,0.95) 10%, rgba(18,20,16,0.6) 100%);
}
.trivia-card__content {
  position: relative; z-index: 1;
  padding: 28px;
  display: flex; flex-direction: column; gap: 16px;
  width: 100%; justify-content: flex-end;
}
.trivia-card__tag {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--status-warn); margin-bottom: auto;
}
.trivia-card__text {
  font-size: 15px; line-height: 1.6; color: #fff; font-weight: 400;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.trivia-card__text--fade { opacity: 0; transform: translateY(10px); }

.trivia-card__action {
  align-self: flex-start;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff; padding: 8px 16px;
  border-radius: var(--radius-pill);
  font-size: 12px; cursor: pointer;
  font-family: var(--font-body);
  backdrop-filter: blur(4px);
  transition: background var(--transition);
}
.trivia-card__action:hover { background: rgba(255,255,255,0.25); }

/* --- CHAT PANEL --- */
.chat-panel {
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  border: 1px solid var(--c-200);
  display: flex; flex-direction: column;
  min-height: 320px;
}
.chat-panel__header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--c-100);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.chat-panel__avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--c-200);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.chat-panel__name   { font-size: 14px; font-weight: 500; display: block; }
.chat-panel__status { font-size: 11px; color: var(--status-ok); }
.chat-panel__status.thinking { color: var(--status-warn); }

.chat-panel__plant-field {
  margin-left: auto;
  background: var(--c-100);
  padding: 6px 12px; border-radius: 8px;
  display: flex; gap: 8px; align-items: center;
}
.chat-panel__plant-label { font-size: 11px; color: var(--text-muted); }
.chat-panel__plant-input {
  background: transparent; border: none;
  color: var(--text-primary); font-family: var(--font-body);
  outline: none; width: 120px; font-weight: 500; font-size: 13px;
}

/* Chat messages */
.chat-messages {
  padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
  flex: 1; overflow-y: auto;
  max-height: 280px;
}

/* ============================================================
   CUSTOM SCROLLBAR
   ============================================================ */
/* Scrollbar Global & Chat Box */
::-webkit-scrollbar {
  width: 6px;  /* Lebar scrollbar vertikal */
  height: 6px; /* Tinggi scrollbar horizontal (jika ada) */
}

::-webkit-scrollbar-track {
  background: transparent; /* Jalur scrollbar transparan agar menyatu dengan background */
}

::-webkit-scrollbar-thumb {
  background: var(--c-300); /* Warna hijau gelap/olive bawaan tema */
  border-radius: var(--radius-pill); /* Membuat ujungnya membulat */
}

::-webkit-scrollbar-thumb:hover {
  background: var(--c-500); /* Warna lebih terang sedikit saat di-hover / disentuh mouse */
}

/* Memperhalus ukuran khusus untuk kotak chat agar tidak terlalu tebal */
.chat-messages::-webkit-scrollbar {
  width: 4px; 
}

.chat-message__bubble {
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 14px; line-height: 1.55;
  max-width: 85%;
  white-space: pre-wrap; /* Preserves newlines from AI response */
}
.chat-message--ai   .chat-message__bubble { background: var(--c-100); border-bottom-left-radius: 4px; }
.chat-message--user .chat-message__bubble {
  background: var(--c-300); color: var(--c-900);
  border-bottom-right-radius: 4px; align-self: flex-end;
  margin-left: auto;
}

/* Typing indicator */
.chat-typing { display: flex; align-items: center; gap: 6px; padding: 12px 16px; }
.chat-typing span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-muted);
  animation: typing 1.2s infinite ease-in-out;
  display: inline-block;
}
.chat-typing span:nth-child(2) { animation-delay: 0.2s; }
.chat-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing { 0%,100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-5px); opacity: 1; } }

/* Input row */
.chat-panel__input-row {
  padding: 16px; border-top: 1px solid var(--c-100);
  display: flex; gap: 10px;
}
.chat-panel__input {
  flex: 1; background: var(--c-100);
  border: 1px solid var(--c-200); color: var(--text-primary);
  border-radius: var(--radius-pill); padding: 10px 16px;
  outline: none; font-family: var(--font-body); font-size: 14px;
  transition: border-color var(--transition);
}
.chat-panel__input:focus { border-color: var(--status-ok); }
.chat-panel__input:disabled { opacity: 0.5; cursor: not-allowed; }

.chat-panel__send-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--status-ok); color: #000; border: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform var(--transition), opacity var(--transition);
  flex-shrink: 0;
}
.chat-panel__send-btn:hover { transform: scale(1.08); }
.chat-panel__send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
</style>
